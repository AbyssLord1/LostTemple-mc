<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LostTemple | Modern PvP</title><style>
:root{--bg:#090d0b;--panel:#121b15;--panel2:#17251b;--green:#61eb83;--mint:#a1ffc0;--muted:#a3b4a8;--border:#31553a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#21412b 0,transparent 44%),var(--bg);color:#edf8ef;font-family:Tahoma,Arial,sans-serif;min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1100px;margin:auto;padding:28px 18px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border);padding-bottom:22px}.logo{font-weight:900;color:var(--green);font-size:26px;letter-spacing:1px}.tag{color:var(--muted);font-size:13px}.hero{text-align:center;padding:80px 10px 38px}.eyebrow{color:var(--green);letter-spacing:2px;font-size:12px}.hero h1{font-size:clamp(38px,7vw,72px);letter-spacing:2px;margin:12px 0 18px;text-shadow:0 0 34px #215f31}.hero p{max-width:720px;margin:0 auto;line-height:2;color:#c3d4c8}.pill{display:inline-block;border:1px solid var(--border);border-radius:99px;padding:8px 16px;color:var(--mint);background:#102016}.navgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:45px 0}.tile{border:1px solid var(--border);border-radius:17px;background:linear-gradient(150deg,#1a2b1e,#101712);padding:30px 18px;text-align:right;color:white;transition:.2s;min-height:140px}.tile:hover{transform:translateY(-3px);border-color:var(--green);box-shadow:0 14px 40px #06240f}.tile strong{display:block;font-size:20px;margin:12px 0 8px}.tile small{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--border);padding:30px;border-radius:18px;max-width:800px;margin:35px auto}.panel h2{margin-top:0;color:var(--green)}.lead{color:#c6d7c9;line-height:2}.stack{display:grid;gap:12px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel2);border:1px solid #2a4b34;color:white;border-radius:12px;padding:18px;text-align:right}.item:hover:not(:disabled){border-color:var(--green)}.item:disabled{opacity:.45;cursor:not-allowed}.action{background:var(--green);color:#07200c;border:0;border-radius:10px;padding:13px 22px;font-weight:800}.ghost{border:1px solid var(--border);background:transparent;color:var(--mint);padding:11px 18px;border-radius:10px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.field{width:100%;background:#09110b;border:1px solid var(--border);border-radius:10px;padding:13px;color:white;margin:9px 0 16px}.notice{padding:14px 18px;border:1px solid #57623b;border-radius:10px;background:#282d17;color:#e5e9b5;line-height:1.9}.muted{color:var(--muted)}.hide{display:none!important}.request{padding:18px;border:1px solid var(--border);border-radius:12px;background:#0d160f;margin:12px 0;line-height:1.9}.footer{text-align:center;color:#748a79;font-size:12px;margin-top:30px}@media(max-width:700px){.navgrid{grid-template-columns:1fr 1fr}.hero{padding-top:55px}.tile{padding:20px 14px}.panel{padding:20px}}@media(max-width:440px){.navgrid{grid-template-columns:1fr}}
</style></head><body><div class="shell"><header class="top"><div class="logo">⛏ LOSTTEMPLE <span style="font-size:11px;color:#9ab6a0">1.21.11</span></div><div class="tag">MODERN PVP • RANKING</div></header><main id="app"></main><div class="footer">© LostTemple • نسخه نمایشی اولیه</div></div><script>
const tests=[{name:'میس فایت',people:['Arman1394']},{name:'اسپیر میس',people:['Arman1394']},{name:'الایترا میس',people:['Arman1394']},{name:'تی‌ان‌تی ماینکارت PvP',people:['Arman1394']},{name:'کریستال PvP',people:['deathpixel','nikan']},{name:'انکور PvP',people:['deathpixel','nikan']},{name:'سورد PvP',people:['deathpixel','nikan','Arman1394']},{name:'سروایول',soon:true},{name:'به‌زودی',soon:true},{name:'به‌زودی',soon:true}];
const app=document.getElementById('app');let selectedTest=null,selectedTester=null;const esc=t=>String(t??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function layout(title,body){app.innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between"><h2>${title}</h2><button class="ghost" onclick="home()">← صفحه اصلی</button></div>${body}</div>`}function home(){app.innerHTML=`<section class="hero"><span class="pill">⚔️ رتبه‌بندی مبارزات ماینکرفت</span><h1>LOST<span style="color:var(--green)">TEMPLE</span></h1><p>به سایت رتبه‌بندی فایت در ماینکرفت مدرن خوش آمدید. تست موردعلاقه‌تان را انتخاب کنید، از تستر وقت بگیرید و رتبه خود را مشخص کنید. رویدادهای جذاب در راه‌اند!</p></section><div class="navgrid"><button class="tile" onclick="ticket()">🎫<strong>تیکت</strong><small>ارسال و پیگیری تیکت</small></button><button class="tile" onclick="chooseTest()">⚔️<strong>تست</strong><small>انتخاب مود و تستر</small></button><button class="tile" onclick="soon()">🏰<strong>عضویت در LostTemple</strong><small>به‌زودی</small></button><button class="tile" onclick="rules()">📜<strong>قوانین</strong><small>اطلاعات اولیه</small></button><button class="tile" onclick="updates()">✨<strong>آپدیت‌ها</strong><small>Events • Ranked SMP</small></button><button class="tile" onclick="admin()">🔐<strong>Admin Code</strong><small>ورود مدیران و تسترها</small></button></div><p class="muted" style="text-align:center">نسخه نمایشی: درخواست‌ها فعلاً فقط در همین مرورگر ذخیره می‌شوند؛ ورود با پیامک و دسترسی مدیران هنوز فعال نشده است.</p>`}
function chooseTest(){layout('⚔️ انتخاب نوع تست',`<p class="lead">نوع تست موردنظر خود را انتخاب کنید.</p><div class="stack">${tests.map((t,i)=>`<button class="item" ${t.soon?'disabled':''} onclick="chooseTester(${i})"><b>${i+1}. ${esc(t.name)}</b><span>${t.soon?'به‌زودی':'←'}</span></button>`).join('')}</div>`)}
function chooseTester(i){selectedTest=i;let t=tests[i];layout('👤 انتخاب تستر',`<p class="lead">تست انتخابی: <b>${esc(t.name)}</b></p><div class="stack">${t.people.map((p,j)=>`<button class="item" onclick="request(${j})">${esc(p)}<span>انتخاب ←</span></button>`).join('')}</div>`)}
function request(j){selectedTester=tests[selectedTest].people[j];layout('🎫 ثبت درخواست تست',`<p class="lead"><b>تست:</b> ${esc(tests[selectedTest].name)}<br><b>تستر:</b> ${esc(selectedTester)}</p><div class="notice">این نسخه هنوز حساب کاربری و تأیید پیامکی ندارد. درخواست شما فعلاً روی همین دستگاه ذخیره می‌شود و به تستر ارسال نمی‌شود.</div><form id="reqform"><label>نام کاربری ماینکرفت</label><input class="field" id="player" maxlength="32" required placeholder="Minecraft Username"><label>پیام درخواست</label><textarea class="field" id="message" rows="5" maxlength="1000" required placeholder="سلام، برای این مود درخواست تست دارم..."></textarea><button class="action" type="submit">ثبت درخواست</button></form><div id="status"></div>`);document.getElementById('reqform').onsubmit=e=>{e.preventDefault();let all=JSON.parse(localStorage.getItem('lt_requests')||'[]');all.push({id:Date.now().toString(36),test:tests[selectedTest].name,tester:selectedTester,player:document.getElementById('player').value.trim(),message:document.getElementById('message').value.trim(),created:new Date().toLocaleString('fa-IR')});localStorage.setItem('lt_requests',JSON.stringify(all));document.getElementById('reqform').reset();document.getElementById('status').innerHTML='<p class="lead" style="color:var(--green)">✅ درخواست به‌صورت آزمایشی در این مرورگر ذخیره شد (ارسال آنلاین نشده است).</p>'}}
function ticket(){layout('🎫 تیکت',`<div class="notice">سیستم تیکت آنلاین هنوز راه‌اندازی نشده است. برای اینکه فقط مدیر مجاز به تیکت‌ها دسترسی داشته باشد، به سرور و ورود امن نیاز داریم.</div>`)}function soon(){layout('🏰 عضویت در LostTemple','<h1 style="font-size:65px;text-align:center;color:var(--green)">به‌زودی</h1>')}function rules(){layout('📜 قوانین',`<p class="lead">به سایت رتبه‌بندی فایت در مودرن فایت خوش آمدید.</p><p class="lead">در این سایت می‌توانید تست‌های موجود را ببینید، تست موردعلاقه‌تان را انتخاب کنید و در زمان تعیین‌شده توسط تستر، در تست شرکت کنید تا رتبه شما مشخص شود.</p><p class="lead">بخش عضویت در LostTemple هم به‌زودی با آپدیتی جدید اضافه می‌شود. منتظر باشید!</p>`)}function updates(){layout('✨ آپدیت‌های LostTemple','<div class="stack"><div class="item">🎉 Events</div><div class="item">🏆 Ranked SMP</div></div><p class="muted">جزئیات این آپدیت‌ها به‌زودی اعلام می‌شود.</p>')}
function admin(){layout('🔐 Admin Code',`<div class="notice">ورود مدیران و تسترها هنوز فعال نشده است. قراردادن کد مخفی در HTML امنیت ندارد؛ برای دسترسی واقعی باید احراز هویت سمت سرور تنظیم شود.</div><p class="lead">در نسخه نهایی، مدیر اصلی به پنل مدیریت همه درخواست‌ها و هر تستر فقط به درخواست‌های تست‌های مجاز خودش دسترسی خواهد داشت.</p>`)}home();
</script></body></html>
