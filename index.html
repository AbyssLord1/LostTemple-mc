<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b120e"><title>LostTemple | Modern PvP</title><style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');
:root{--bg:#070b08;--surface:#111b15;--surface2:#19291e;--stroke:#31553a;--neon:#7bf59b;--text:#f0fff3;--muted:#a4bca9;--warn:#ffc77d}*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;background:radial-gradient(ellipse at 80% 0%,#163520 0%,transparent 42%),radial-gradient(ellipse at 10% 65%,#0e2315 0%,transparent 36%),var(--bg);min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:var(--neon)}.wrap{width:min(1150px,92%);margin:auto}.top{border-bottom:1px solid #26452e;background:#09120ccf;position:sticky;top:0;z-index:10;backdrop-filter:blur(18px)}.nav{display:flex;justify-content:space-between;align-items:center;padding:17px 0;gap:12px}.brand{font-weight:900;font-size:23px;letter-spacing:.4px;color:var(--neon);display:flex;align-items:center;gap:8px}.nav-actions{display:flex;align-items:center;gap:8px}.btn{background:var(--neon);color:#06180b;border:1px solid var(--neon);border-radius:10px;padding:11px 19px;font-weight:800;transition:.2s}.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}.btn.ghost{background:transparent;color:var(--text);border-color:#3c6e46}.btn.small{padding:7px 12px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}.hero{text-align:center;padding:75px 10px 42px}.eyebrow{display:inline-block;padding:7px 15px;color:var(--neon);border:1px solid #407a4b;border-radius:100px;background:#142a19;font-size:12px;font-weight:800}.hero h1{font-size:clamp(46px,9vw,94px);margin:13px 0 0;line-height:1.25;letter-spacing:-2px;text-shadow:0 0 50px #49e07045}.hero h1 span{color:var(--neon)}.hero p{max-width:660px;margin:12px auto;color:var(--muted);line-height:2;font-size:15px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0}.section-title h2{margin:0;font-size:21px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.tile{min-height:165px;background:linear-gradient(140deg,#16291b,#0e1611);border:1px solid #315b3a;border-radius:17px;padding:25px;text-align:right;transition:.2s;color:var(--text);box-shadow:0 16px 40px #0005}.tile:hover{border-color:var(--neon);transform:translateY(-3px);box-shadow:0 0 32px #47f47b17}.tile .em{font-size:31px}.tile h3{margin:14px 0 6px;font-size:19px}.tile p{margin:0;color:var(--muted);font-size:12px}.panel{border:1px solid #30543a;background:linear-gradient(135deg,#14251a,#0c140f);border-radius:18px;padding:24px;margin:20px 0}.stack{display:grid;gap:10px}.item{width:100%;text-align:right;display:flex;align-items:center;justify-content:space-between;gap:15px;background:#16281b;border:1px solid #386346;border-radius:12px;padding:15px 18px;color:var(--text)}.item:hover{border-color:var(--neon)}.sub{font-size:12px;color:var(--muted)}h2,h3{line-height:1.5}p{line-height:1.9}.muted{color:var(--muted)}.pill{display:inline-block;border:1px solid #3b714b;background:#153120;color:#9cf6ae;border-radius:100px;padding:4px 11px;font-size:12px}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:13px;color:#c2e7cb}.field input,.field textarea,.field select{width:100%;background:#0b130d;color:var(--text);border:1px solid #3e6748;border-radius:10px;padding:13px;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--neon)}.field textarea{min-height:105px;resize:vertical}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.back{background:none;color:var(--neon);border:0;padding:10px 0}.notice{padding:13px;border:1px solid #6b6638;background:#302c12;color:#fff0a6;border-radius:11px;font-size:13px;margin:12px 0}.error{border-color:#a95353;background:#3d1d1d;color:#ffbaba}.success{border-color:#408052;background:#17371f;color:#b7ffc4}.chat{height:310px;overflow:auto;background:#09110c;border:1px solid #2c5036;border-radius:12px;padding:15px;display:flex;flex-direction:column;gap:11px}.bubble{max-width:88%;align-self:flex-start;background:#1c3423;border:1px solid #42634b;border-radius:12px;padding:10px 14px;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#204e30;border-color:#4b9d61}.bubble small{display:block;color:#a8cbb0;font-size:10px;margin-top:4px}.footer{text-align:center;padding:42px 15px;color:#8aaf93;font-size:12px}.hidden{display:none!important}.container{min-height:55vh}.mode-head{display:flex;gap:14px;align-items:center}.mode-head span{font-size:28px}@media(max-width:750px){.grid{grid-template-columns:1fr}.hero{padding-top:42px}.nav{flex-wrap:wrap}.tile{min-height:125px}.panel{padding:17px}} 
</style></head><body><header class="top"><div class="wrap nav"><div class="brand">⛏ LostTemple <span class="pill">1.21.11</span></div><div class="nav-actions"><button class="btn ghost small" id="requestsBtn">درخواست‌های من</button><button class="btn small" id="authBtn">ورود / عضویت</button></div></div></header><main class="wrap container" id="app"></main><footer class="footer">© LostTemple · Modern PvP & Events · ساخته‌شده برای جامعه ماینکرفت</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
// Fill these two values from Supabase > Project Settings > API. Publishable/anon key is safe to expose with RLS; NEVER use service_role key here.
const SUPABASE_URL='PASTE_SUPABASE_PROJECT_URL';
const SUPABASE_ANON_KEY='PASTE_SUPABASE_ANON_KEY';
const configured=SUPABASE_URL.startsWith('https://')&&(SUPABASE_ANON_KEY.startsWith('eyJ')||SUPABASE_ANON_KEY.startsWith('sb_publishable_'));
const db=configured && window.supabase ? window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const MODES=[['mace','میس فایت','🔨',['Arman1394']],['spear','اسپیر میث','🔱',['Arman1394']],['elytra','الایترا میث','🪽',['Arman1394']],['tnt','تی‌ان‌تی ماینکارت PvP','💥',['Arman1394']],['crystal','کریستال PvP','💎',['deathpixel','nikan']],['anchor','انکر PvP','⚡',['deathpixel','nikan']],['sword','سورد PvP','⚔️',['deathpixel','nikan','Arman1394']]];
let me=null,myRole=null,route='home',chosenMode=null,chosenTester=null,openRequest=null;
const el=document.querySelector('#app');const clean=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const title=s=>`<div class="section-title"><h2>${s}</h2><button class="back" onclick="go('home')">← بازگشت به خانه</button></div>`;
const notice=(s,type='notice')=>`<div class="${type}">${s}</div>`;
const logged=()=>Boolean(me);const needBackend=()=>!db?notice('برای فعال شدن ورود با پیامک، تیکت و درخواست تست واقعی، ابتدا دیتابیس Supabase را با فایل راهنما وصل کن. این نسخه کدهای دسترسی جعلی ندارد.'):'';
function go(r){route=r;openRequest=null;render();window.scrollTo(0,0)}
function home(){return `<section class="hero"><div class="eyebrow">MINECRAFT MODERN PVP · LOSTTEMPLE</div><h1>LOST<span>TEMPLE</span></h1><p>به دنیای رقابت‌های مدرن ماینکرفت خوش آمدید؛ مودهای متنوع فایت، تست مهارت، رتبه‌بندی بازیکنان و ایونت‌های هیجان‌انگیز.</p><div class="row" style="justify-content:center"><button class="btn" onclick="go('tests')">شروع تست ⚔️</button><button class="btn ghost" onclick="go('updates')">آخرین آپدیت‌ها</button></div></section><div class="section-title"><h2>بخش‌های سایت</h2><span class="pill">۶ بخش اصلی</span></div><div class="grid">${[['tickets','🎫','تیکت','ارسال و پیگیری تیکت'],['tests','⚔️','تست','انتخاب مود و تستر'],['join','🏰','عضویت در LostTemple','به‌زودی'],['rules','📜','قوانین','قوانین و راهنما'],['updates','✨','آپدیت‌ها','Events · Ranked SMP'],['admin','🔐','Admin Code','ورود مسئولان و تسترها']].map(([id,icon,name,desc])=>`<button class="tile" onclick="go('${id}')"><div class="em">${icon}</div><h3>${name}</h3><p>${desc}</p></button>`).join('')}</div><div class="panel"><h3>🏆 Modern PvP 1.21.11</h3><p class="muted">تست مد نظرت رو انتخاب کن، تستر مربوط به اون مود رو مشخص کن و درخواستت رو برای هماهنگی ثبت کن.</p></div>`}
function tests(){return `${title('⚔️ انتخاب تست')}<p class="muted">اول مود رو انتخاب کن، بعد تستر همون مود رو انتخاب کن و درخواست ثبت کن.</p><div class="stack">${MODES.map(([id,name,icon])=>`<button class="item" onclick="chooseMode('${id}')"><b>${icon} ${name}</b><span>انتخاب ←</span></button>`).join('')}${[8,9,10].map((n)=>`<div class="item" style="opacity:.5"><b>🔒 تست ${n===8?'سروایو':n} — به‌زودی</b><span>غیرفعال</span></div>`).join('')}</div>`}
function chooseMode(id){chosenMode=MODES.find(x=>x[0]===id);go('testers')}
function testers(){if(!chosenMode)return tests();return `${title('👑 Testers — انتخاب تستر')}<div class="panel mode-head"><span>${chosenMode[2]}</span><div><h3>${chosenMode[1]}</h3><div class="muted">فقط تسترهای مجاز این مود</div></div></div><div class="stack">${chosenMode[3].map(n=>`<button class="item" onclick="chooseTester('${n}')"><b>🎮 ${n}</b><span>ثبت درخواست ←</span></button>`).join('')}</div>`}
function chooseTester(n){chosenTester=n;go('requestTest')}
function requestTest(){if(!chosenMode||!chosenTester)return tests();return `${title('📝 ثبت درخواست تست')}<div class="panel"><div class="pill">${chosenMode[1]} · ${chosenTester}</div>${needBackend()}${!logged()?`${notice('برای ثبت و پیگیری درخواست، ابتدا با شماره موبایل وارد حساب شوید.')}<button class="btn" onclick="go('login')">ورود با موبایل</button>`:`<form onsubmit="submitRequest(event,'test')"><div class="field"><label>موضوع درخواست</label><input id="subject" required minlength="2" maxlength="140" value="درخواست تست ${clean(chosenMode[1])}"></div><div class="field"><label>پیام به تستر</label><textarea id="firstMessage" required maxlength="2000" placeholder="سلام، برای تست این مود آماده‌ام. لطفاً زمان پیشنهادی رو بگید."></textarea></div><button class="btn" ${!db?'disabled':''}>ثبت و ارسال درخواست</button></form>`}</div>`}
function tickets(){return `${title('🎫 تیکت')}<div class="panel"><p>برای پشتیبانی یا هماهنگی می‌تونی تیکت ارسال کنی؛ پاسخ‌ها داخل همان گفتگو نمایش داده می‌شن.</p>${needBackend()}${!logged()?`<button class="btn" onclick="go('login')">ورود و ارسال تیکت</button>`:`<form onsubmit="submitRequest(event,'ticket')"><div class="field"><label>موضوع تیکت</label><input id="subject" required maxlength="140" minlength="2" placeholder="مثلاً مشکل در تست"></div><div class="field"><label>پیام</label><textarea id="firstMessage" required maxlength="2000" placeholder="موضوع رو با جزئیات توضیح بده"></textarea></div><button class="btn" ${!db?'disabled':''}>ارسال تیکت</button></form>`}</div>`}
function rules(){return `${title('📜 قوانین LostTemple')}<div class="panel"><h2>خوش آمدید به سایت رتبه‌بندی مدرن فایت</h2><p>در این سایت می‌توانید با ورود به بخش تست، مودهای موجود را مشاهده کنید و هرکدام را که می‌پسندید انتخاب کنید. سپس با تستر مربوطه هماهنگ کنید و در زمان تعیین‌شده تست بدهید تا سطح مهارتتان مشخص شود.</p><p>هنگام ثبت درخواست، نام ماینکرفت و اطلاعات درست ارائه کنید؛ به تسترها احترام بگذارید و از اسپم، توهین و ثبت درخواست‌های تکراری پرهیز کنید.</p><p>قوانین مسابقات، نحوه تعیین رتبه و مجازات تخلفات بعداً توسط مدیریت تکمیل و به‌روزرسانی می‌شود.</p><p class="muted">منتظر آپدیت جدید عضویت در LostTemple باشید.</p></div>`}
function updates(){return `${title('✨ آپدیت‌های LostTemple')}<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))"><div class="panel"><h2>🎉 Events</h2><p>ایونت‌های جدید LostTemple</p><span class="pill">به‌زودی</span></div><div class="panel"><h2>🏆 Ranked SMP</h2><p>رتبه‌بندی و چالش‌های SMP</p><span class="pill">به‌زودی</span></div></div>`}
function join(){return `${title('🏰 عضویت در LostTemple')}<div class="panel" style="text-align:center;padding:90px 20px"><div style="font-size:65px">🏰</div><h2 style="font-size:clamp(30px,7vw,65px);color:var(--neon)">به‌زودی</h2><p>سیستم عضویت در LostTemple در آپدیت آینده اضافه خواهد شد.</p></div>`}
function login(){return `${title('📱 ورود با شماره موبایل')}<div class="panel" style="max-width:570px;margin:22px auto">${needBackend()}<p>شماره را با پیش‌شماره کشور وارد کنید؛ مثلاً +989xxxxxxxxx. ارسال کد پیامکی به فعال‌بودن سرویس پیامک در Supabase بستگی دارد.</p><form onsubmit="sendOtp(event)"><div class="field"><label>شماره موبایل</label><input id="phone" required dir="ltr" placeholder="+989123456789" autocomplete="tel"></div><button class="btn" ${!db?'disabled':''}>ارسال کد ورود</button></form><div id="otpBox" class="hidden"><form onsubmit="verifyOtp(event)"><div class="field"><label>کد پیامکی</label><input id="otp" inputmode="numeric" required autocomplete="one-time-code" dir="ltr"></div><div class="field"><label>نام بازیکن در ماینکرفت</label><input id="playerName" required maxlength="32" placeholder="Minecraft username"></div><button class="btn">تأیید و ورود</button></form></div><div id="authStatus"></div></div>`}
function admin(){return `${title('🔐 ورود مدیریت و تسترها')}<div class="panel" style="max-width:620px;margin:20px auto"><h3>فعال‌سازی سطح دسترسی</h3><p class="muted">هر مدیر یا تستر ابتدا با شماره خودش وارد می‌شود و فقط یک‌بار کد دعوت اختصاصی را ثبت می‌کند. این کدها داخل فایل عمومی سایت ذخیره نمی‌شوند.</p>${needBackend()}${!logged()?`<button class="btn" onclick="go('login')">ابتدا وارد حساب شو</button>`:`${myRole?notice('دسترسی شما: '+clean(myRole.role)+(myRole.tester_handle?' · '+clean(myRole.tester_handle):''),'success'):`<form onsubmit="redeemCode(event)"><div class="field"><label>کد دعوت اختصاصی</label><input id="adminCode" required autocomplete="off" type="password" placeholder="LT-..."></div><button class="btn">فعال‌سازی کد</button></form>`}<div class="row"><button class="btn ghost" onclick="go('inbox')">صندوق درخواست‌های مجاز</button></div>`}</div>`}
async function authRefresh(){if(!db){me=null;myRole=null;return}try{const {data}=await db.auth.getUser();me=data.user||null;if(me){const res=await db.from('lt_roles').select('role,tester_handle').eq('user_id',me.id).maybeSingle();myRole=res.data||null}else myRole=null}catch(e){console.error(e)}}
function render(){document.getElementById('authBtn').textContent=logged()?'خروج از حساب':'ورود / عضویت';el.innerHTML=({home,tests,testers,requestTest,tickets,rules,updates,join,login,admin})[route]?.()|| ((route==='inbox'||route==='thread')?'<div class="panel">در حال دریافت درخواست‌ها...</div>':home());if(route==='inbox')loadInbox();if(route==='thread')loadThread()}
function showError(msg){const d=document.createElement('div');d.className='notice error';d.textContent=msg;el.prepend(d);window.scrollTo(0,0)}
function showToast(msg){const d=document.createElement('div');d.className='notice success';d.textContent=msg;el.prepend(d)}
async function sendOtp(e){e.preventDefault();if(!db)return;const phone=document.getElementById('phone').value.trim();const {error}=await db.auth.signInWithOtp({phone});if(error)return showError(error.message);window.currentPhone=phone;document.getElementById('otpBox').classList.remove('hidden');document.getElementById('authStatus').textContent='کد به شماره شما ارسال شد.'}
async function verifyOtp(e){e.preventDefault();if(!db)return;const {error}=await db.auth.verifyOtp({phone:window.currentPhone,token:document.getElementById('otp').value.trim(),type:'sms'});if(error)return showError(error.message);await authRefresh();const name=document.getElementById('playerName').value.trim();if(name){const {error:err}=await db.from('lt_profiles').upsert({id:me.id,player_name:name});if(err)return showError(err.message)}go('home')}
async function submitRequest(e,kind){e.preventDefault();if(!db||!me)return go('login');const subject=document.getElementById('subject').value.trim(),body=document.getElementById('firstMessage').value.trim();if(body.length<2)return showError('پیام رو کامل‌تر بنویس');const data={kind,user_id:me.id,subject,...(kind==='test'?{mode:chosenMode[0],tester_handle:chosenTester}:{})};const {data:r,error}=await db.from('lt_requests').insert(data).select('id').single();if(error)return showError(error.message);const {error:msgerr}=await db.from('lt_messages').insert({request_id:r.id,author_id:me.id,body});if(msgerr)return showError('درخواست ثبت شد، اما پیام اول ارسال نشد: '+msgerr.message);go('inbox')}
async function redeemCode(e){e.preventDefault();const code=document.getElementById('adminCode').value.trim();const {error,data}=await db.rpc('lt_redeem',{code_text:code});if(error)return showError(error.message);await authRefresh();render();showToast(data)}
async function loadInbox(){if(!db){el.innerHTML=title('📥 صندوق درخواست‌ها')+needBackend();return}if(!me){go('login');return}const {data,error}=await db.from('lt_requests').select('*').order('created_at',{ascending:false}).limit(100);if(error){el.innerHTML=title('صندوق درخواست‌ها');showError(error.message);return}el.innerHTML=title('📥 صندوق درخواست‌ها')+`<div class="panel"><p class="muted">درخواست‌های شخصی شما و، اگر مجاز باشید، درخواست‌های مربوط به نقش مدیریت یا تستر شما نمایش داده می‌شوند.</p><div class="stack">${data.length?data.map(r=>`<button class="item" onclick="openThread('${r.id}')"><span><b>${r.kind==='ticket'?'🎫 تیکت':'⚔️ تست'} · ${clean(r.subject)}</b><br><small class="sub">${r.kind==='test'?clean(r.tester_handle)+' · ':''}${new Date(r.created_at).toLocaleString('fa-IR')}</small></span><span class="pill">${({open:'باز',in_progress:'در حال بررسی',closed:'بسته'})[r.status]}</span></button>`).join(''):'<p>درخواستی وجود ندارد.</p>'}</div></div>`}
function openThread(id){openRequest=id;route='thread';render()}
async function loadThread(){if(!db||!openRequest)return go('inbox');const {data:r,error}=await db.from('lt_requests').select('*').eq('id',openRequest).single();if(error||!r){el.innerHTML=title('درخواست');showError('دسترسی به این درخواست وجود ندارد');return}const {data:msgs,error:err}=await db.from('lt_messages').select('id,author_id,body,created_at').eq('request_id',r.id).order('created_at',{ascending:true});if(err)return showError(err.message);const staff=myRole&& (myRole.role==='owner'||(r.kind==='ticket'&&myRole.role==='ticket_staff')||(r.kind==='test'&&(myRole.role==='test_manager'||(myRole.role==='tester'&&myRole.tester_handle===r.tester_handle))));el.innerHTML=title((r.kind==='ticket'?'🎫 تیکت: ':'⚔️ تست: ')+clean(r.subject))+`<div class="panel"><div class="row"><span class="pill">${r.kind==='test'?clean(MODES.find(m=>m[0]===r.mode)?.[1])+' · تستر '+clean(r.tester_handle):'پشتیبانی'}</span><span class="pill">${({open:'باز',in_progress:'در حال بررسی',closed:'بسته'})[r.status]}</span></div><div class="chat" id="chat">${(msgs||[]).map(m=>`<div class="bubble ${m.author_id===me.id?'mine':''}">${clean(m.body)}<small>${m.author_id===me.id?'شما':'کاربر دیگر'} · ${new Date(m.created_at).toLocaleString('fa-IR')}</small></div>`).join('')}</div>${r.status!=='closed'?`<form onsubmit="sendMessage(event,'${r.id}')"><div class="field"><label>پیام جدید</label><textarea id="chatText" required maxlength="2000" placeholder="پیامت را بنویس..."></textarea></div><button class="btn">ارسال پیام</button></form>`:'<p class="muted">این گفتگو بسته شده است.</p>'}${staff?`<div class="row" style="margin-top:17px"><button class="btn ghost" onclick="setStatus('${r.id}','in_progress')">در حال بررسی</button><button class="btn ghost" onclick="setStatus('${r.id}','closed')">بستن درخواست</button><button class="btn ghost" onclick="setStatus('${r.id}','open')">باز کردن مجدد</button></div>`:''}</div>`;document.getElementById('chat')?.scrollTo(0,999999)}
async function sendMessage(e,id){e.preventDefault();const body=document.getElementById('chatText').value.trim();if(!body)return;const {error}=await db.from('lt_messages').insert({request_id:id,author_id:me.id,body});if(error)return showError(error.message);loadThread()}
async function setStatus(id,new_status){const {error}=await db.rpc('lt_set_status',{req_id:id,new_status});if(error)return showError(error.message);loadThread()}
document.getElementById('authBtn').onclick=async()=>{if(me&&db){await db.auth.signOut();await authRefresh();go('home')}else go('login')};document.getElementById('requestsBtn').onclick=()=>go('inbox');
(async()=>{await authRefresh();render()})();
</script></body></html>
